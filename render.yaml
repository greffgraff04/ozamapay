services:
  - type: web
    name: ozamapay-backend
    env: node
    rootDir: backend
    autoDeploy: true
    buildCommand: npm ci && npx prisma generate && npm run build && npx prisma migrate deploy && npx prisma db seed
    startCommand: NODE_OPTIONS=--max-old-space-size=384 node dist/main
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OZAMAPAY_MASTER_ID
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MONCASH_CLIENT_ID
        sync: false
      - key: MONCASH_SECRET_KEY
        sync: false
      - key: MONCASH_URL
        sync: false
      - key: MONCASH_MODE
        sync: false
      - key: MONCASHCONNECT_PUBLIC_KEY
        sync: false
      - key: MONCASHCONNECT_SECRET_KEY
        sync: false
      - key: MONCASHCONNECT_WEBHOOK_SECRET
        sync: false
      - key: STROWALLET_PUBLIC_KEY
        sync: false
      - key: STROWALLET_SECRET_KEY
        sync: false
      - key: STROWALLET_WEBHOOK_SECRET
        sync: false
      - key: IMAGEKIT_PUBLIC_KEY
        sync: false
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: IMAGEKIT_URL_ENDPOINT
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: TRON_MASTER_MNEMONIC
        sync: false
      - key: TRONGRID_API_KEY
        sync: false
      - key: TRONGRID_BASE_URL
        sync: false
      - key: USDT_TRC20_CONTRACT_ADDRESS
        sync: false
      - key: USDT_MIN_CONFIRMATIONS
        sync: false
      - key: TRON_MONITOR_REQUEST_INTERVAL_MS
        sync: false
      - key: SWEEP_MASTER_MNEMONIC
        sync: false
      - key: SWEEP_GAS_FUNDING_TRX
        sync: false
      - key: SWEEP_MIN_USDT_THRESHOLD
        sync: false
      - key: SWEEP_AUTO_MAX_USDT_PER_ADDRESS
        sync: false
      - key: SWEEP_AUTO_MAX_TOTAL_USDT_PER_CYCLE
        sync: false
      - key: RECONCILIATION_TOLERANCE_USDT
        sync: false
      - key: RECONCILIATION_REQUEST_INTERVAL_MS
        sync: false
      - key: TRON_HEALTH_MONITOR_STALE_MINUTES
        sync: false
      - key: TRON_HEALTH_DEPOSIT_STUCK_HOURS
        sync: false
      - key: TRON_HEALTH_SWEEP_STUCK_HOURS
        sync: false
      - key: TRONGRID_DAILY_QUOTA
        sync: false
      - key: TRONGRID_QUOTA_ALERT_THRESHOLD_PCT
        sync: false
      - key: TRON_HEALTH_RATE_STALE_HOURS
        sync: false
      - key: NODE_ENV
        value: production
